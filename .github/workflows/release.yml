name: Build Release Package

on:
  release:
    types: [published]

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build project
        run: npm run build
        
      - name: Archive build artifacts
        shell: bash
        run: |
          mkdir -p theme-package
          preview_file="$(node -e 'const fs = require("fs"); process.stdout.write(JSON.parse(fs.readFileSync("komari-theme.json", "utf8")).preview || "")')"
          if [[ ! "$preview_file" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid preview filename in komari-theme.json" >&2
            exit 1
          fi
          cp preview.png "theme-package/$preview_file"
          cp komari-theme.json theme-package/
          cp -r dist theme-package/
          cd theme-package
          zip -r ../komari-atlas.zip .

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" komari-atlas.zip --clobber

name: Build and Release Assets

on:
  release:
    types: [published]

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build project
        run: npm run build
        
      - name: Archive build artifacts
        run: |
          mkdir -p theme-package
          cp preview.png theme-package/
          cp komari-theme.json theme-package/
          cp -r dist theme-package/
          cd theme-package
          zip -r ../komari-atlas.zip .

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" komari-atlas.zip --clobber
